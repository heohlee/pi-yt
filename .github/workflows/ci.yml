name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', 'current']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Test release check
        run: node --test .github/scripts/release-check.test.cjs

      # Dev-only transitive packages declare install scripts; none are needed to test, type check or lint.
      - name: Install
        run: npm ci --ignore-scripts

      # Runs every test and fails below 85% line, branch or function coverage of lib/ and extensions/.
      - name: Test and coverage
        run: npm run coverage

      - name: Type check
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Package contents
        run: npm pack --dry-run

  ci:
    name: CI
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
